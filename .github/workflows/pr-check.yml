name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run unit tests
      run: pnpm test

    - name: Type check
      run: pnpm vue-tsc --noEmit

    - name: Build web
      run: pnpm build

    - name: Install Chromium
      run: pnpm exec playwright install --with-deps chromium

    - name: Check production build in Chromium
      run: pnpm test:browser

    - name: Upload browser test report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-report
        path: playwright-report/
        retention-days: 7

  rust-checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target

    - name: Check Rust formatting
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

    - name: Run Rust lints
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

    - name: Run Rust tests
      run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
